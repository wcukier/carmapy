name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      run_slow:
        description: "Run slow regression tests"
        type: boolean
        default: false

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Install gfortran (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install gfortran (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install gcc
          echo "$(brew --prefix gcc)/bin" >> $GITHUB_PATH
          echo "FC=$(brew --prefix gcc)/bin/gfortran" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install carmapy with test extras
        env:
          CARMAPY_NATIVE: "0"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        env:
          CARMAPY_RUN_SLOW: ${{ (github.event_name == 'schedule' || inputs.run_slow) && '1' || '0' }}
        run: pytest
