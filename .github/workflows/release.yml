name: Build and release CARMApy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_macos:
    name: Build macOS wheels
    runs-on: macos-latest
    steps:
      # Checkout repository with submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Set up Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install dependencies
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel delocate build
          brew install gcc  # ensures gfortran is available

      # Set environment variables for building
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "pp*"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          # Use gfortran from Homebrew
          FC: gfortran
          FORTRAN: gfortran
          PATH: /opt/homebrew/bin:${PATH}   # ARM Macs
          MACOSX_DEPLOYMENT_TARGET: 15.0    # matches Homebrew GCC minimum

      # Upload wheels
      - uses: actions/upload-artifact@v4
        with:
          name: macos-wheels
          path: wheelhouse/*.whl


